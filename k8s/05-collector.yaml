apiVersion: v1
kind: Service
metadata:
  name: oss-collector
  namespace: oss-lite
  labels:
    app: oss-collector
spec:
  selector:
    app: oss-collector
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oss-collector
  namespace: oss-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oss-collector
  template:
    metadata:
      labels:
        app: oss-collector
    spec:
      containers:
        - name: collector
          image: oss-collector:0.2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: oss-db, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: oss-db, key: POSTGRES_PASSWORD }
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: collector-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: collector-config, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: collector-config, key: DB_NAME }
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "256Mi", cpu: "500m" }
